x-app: &app
  build: .
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    API_KEY: ${API_KEY:-dev-secret-key}
    MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
    RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-2}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5672"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  outbox-relay:
    <<: *app
    command: ["python", "-m", "app.outbox"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  consumer:
    <<: *app
    command: ["faststream", "run", "app.worker.consumer:app"]
    environment:
      <<: *app-env
      CONSUMER_PREFETCH: ${CONSUMER_PREFETCH:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  webhook-echo:
    image: mendhak/http-https-echo:37
    environment:
      HTTP_PORT: 8080
      LOG_IGNORE_PATH: /ping

volumes:
  pgdata:
  rabbitmq_data:
